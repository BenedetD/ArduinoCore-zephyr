
# =============================================================================
#  eura_opta.conf  -  CONFIG aggiuntivi per il LOADER Arduino-Zephyr (Opta)
# -----------------------------------------------------------------------------
#  Da AGGIUNGERE al file di configurazione del loader per la variante Opta:
#      variants/arduino_opta_stm32h747xx_m7/arduino_opta_stm32h747xx_m7.conf
#  (nel repo ArduinoCore-zephyr), poi ricompilare il loader (vedi REBUILD.md).
#
#  Questi simboli NON sono presenti nel loader stock 0.55.2 e vanno abilitati
#  PRIMA di poterli esportare in eura_llext_exports.c.
# =============================================================================

# ---- SNTP: necessario per sntp_simple() (ntpclient_compat) ----
CONFIG_SNTP=y

# ---- Thread dinamici: OBBLIGATORIO. rtos::Thread (os_compat) alloca lo stack a
#      runtime con k_thread_stack_alloc(). Nel loader STOCK 0.55.2 quella funzione
#      e' uno STUB che ritorna NULL (verificato su binario: z_impl_k_thread_stack_alloc
#      = "movs r0,#0; bx lr") perche' DYNAMIC_THREAD_ALLOC=n e pool=0. Senza queste
#      opzioni NESSUN rtos::Thread parte (logger + tutti i task) -> firmware inerte
#      dopo setup(). Confermato su HW: Thread::start() ritorna -1. ----
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_PREFER_ALLOC=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
# Lo heap di sistema (k_heap) contiene la somma degli stack dei thread dinamici
# (rtos::Thread -> k_thread_stack_alloc(stack_size)) + il k_malloc del loader.
# IMPORTANTE: la stima precedente "14 x 8192 = 114KB" era SBAGLIATA: Thread::start
# alloca la dimensione PER-THREAD reale, non DYNAMIC_THREAD_STACK_SIZE. Somma reale
# stack EuraPortenta (.ino + globals.h): logger3072 data2048 cmd2048 rule4096
# reporter4096 net4096 wd2048 updev3072 tcp1024 cloud3072 opta3072 event4096
# heavy12288 ~= 48KB nominali (~60-70KB con arrotondamento MPU/guard).
#
# Analisi RAM dal .map del loader (build 13/06):
#   AXI SRAM 512KB @0x24000000; immagine statica fino a _end=0x24071eb8;
#   __kernel_ram_end=0x24080000 -> arena malloc app (COMMON_LIBC_MALLOC_ARENA_SIZE
#   =-1 = tutta la RAM rimanente) = solo ~57.7KB. Il k_heap (questo CONFIG) e'
#   dentro l'immagine statica: OGNI byte tolto qui confluisce nell'arena malloc.
# 196608 (192KB) -> arena ~57KB (OOM su devices.json). 131072 (128KB) libera 64KB
# -> arena ~121KB: deserialize OK ma 22 device (~52KB) + runtime (~20KB) = OOM.
# 98304 (96KB) -> arena ~155KB: 19/22 device creati, runtime heap=3KB (OOM).
# 65536 (64KB) -> arena ~187KB: tutti 22 device + runtime con margine.
# Stack reali EuraPortenta ~65KB: con k_heap=64KB il margine e' stretto ma
# accettabile perche' non tutti gli stack sono allocati al momento del boot config.
# Se i thread non partono (Thread::start()=-1) RIALZARE a 80KB o 96KB.
CONFIG_HEAP_MEM_POOL_SIZE=65536

# ---- MQTT nativo Zephyr: sostituisce ArduinoMqttClient eliminando i problemi
#      di framing/short-write su TCP. Espone mqtt_connect/disconnect/publish/
#      subscribe/input/live/abort allo sketch via EXPORT_SYMBOL. ----
CONFIG_MQTT_LIB=y
# MQTT usa zsock internamente: gia' abilitato (CONFIG_NET_SOCKETS=1)

# ---- sys_reboot(): opzionale. Lo sketch usa gia' un reset inline SCB->AIRCR
#      (hal_compat.h), quindi questo NON e' strettamente necessario. Abilitarlo
#      solo se si preferisce esportare e usare sys_reboot() al posto del reset
#      inline (in tal caso aggiungere anche EXPORT_SYMBOL(sys_reboot)). ----
# CONFIG_REBOOT=y

