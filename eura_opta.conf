# =============================================================================
#  eura_opta.conf  -  CONFIG aggiuntivi per il LOADER Arduino-Zephyr (Opta)
# -----------------------------------------------------------------------------
#  Da AGGIUNGERE al file di configurazione del loader per la variante Opta:
#      variants/arduino_opta_stm32h747xx_m7/arduino_opta_stm32h747xx_m7.conf
#  (nel repo ArduinoCore-zephyr), poi ricompilare il loader (vedi REBUILD.md).
#
#  Questi simboli NON sono presenti nel loader stock 0.55.2 e vanno abilitati
#  PRIMA di poterli esportare in eura_llext_exports.c.
# =============================================================================

# ---- SNTP: necessario per sntp_simple() (ntpclient_compat) ----
CONFIG_SNTP=y

# ---- Thread dinamici: OBBLIGATORIO. rtos::Thread (os_compat) alloca lo stack a
#      runtime con k_thread_stack_alloc(). Nel loader STOCK 0.55.2 quella funzione
#      e' uno STUB che ritorna NULL (verificato su binario: z_impl_k_thread_stack_alloc
#      = "movs r0,#0; bx lr") perche' DYNAMIC_THREAD_ALLOC=n e pool=0. Senza queste
#      opzioni NESSUN rtos::Thread parte (logger + tutti i task) -> firmware inerte
#      dopo setup(). Confermato su HW: Thread::start() ritorna -1. ----
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_PREFER_ALLOC=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
# Lo heap di sistema deve contenere la somma degli stack dei ~14 thread (alloc da
# heap) + k_malloc. NB: 262144 (256KB) fa OVERFLOW della RAM del loader (~8KB);
# 196608 (192KB) entra con margine. Alzare con cautela se i thread esauriscono.
CONFIG_HEAP_MEM_POOL_SIZE=196608

# ---- sys_reboot(): opzionale. Lo sketch usa gia' un reset inline SCB->AIRCR
#      (hal_compat.h), quindi questo NON e' strettamente necessario. Abilitarlo
#      solo se si preferisce esportare e usare sys_reboot() al posto del reset
#      inline (in tal caso aggiungere anche EXPORT_SYMBOL(sys_reboot)). ----
# CONFIG_REBOOT=y

# ---- stdio FILE (fopen/fread/fwrite/fseek/ftell/fclose/remove/rename) ----
#  ATTENZIONE: il loader stock e' compilato con picolibc SENZA il backend FILE,
#  quindi fopen & co. non esistono. Due strade:
#    (A) [CONSIGLIATA] Rifattorizzare le poche chiamate fopen/fread del firmware
#        su fs_* / UFile (storage_compat) -> NESSUNA modifica al loader.
#    (B) Abilitare il backend stdio di picolibc su Zephyr (sperimentale) e poi
#        esportare i simboli fopen/... In tal caso valutare:
# CONFIG_PICOLIBC=y
# CONFIG_POSIX_FILE_SYSTEM=y     # gia' attivo
# (il binding FILE*->zvfs su picolibc/Zephyr non e' garantito: testare).
