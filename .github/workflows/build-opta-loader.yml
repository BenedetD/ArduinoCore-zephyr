name: Build Opta loader (EuraPortenta)

# Compila il loader Arduino-Zephyr per Arduino Opta con gli export aggiuntivi
# richiesti da EuraPortenta (mbedTLS/net/errno/SNTP), su runner Linux GitHub.
# Nessun Linux locale necessario: si scarica l'artifact e si flasha da Windows.
#
# USO:
#  1. Fai un fork di https://github.com/arduino/ArduinoCore-zephyr (branch/tag 0.55.2).
#  2. Nel fork crea la cartella  eura/  e copiaci dentro:
#         eura/eura_llext_exports.c      (da loader_rebuild/)
#         eura/eura_opta.conf            (da loader_rebuild/)
#         eura/eura_opta_flash.overlay   (da loader_rebuild/)  <- allarga user_sketch a 1 MiB
#  3. Copia questo file in  .github/workflows/build-opta-loader.yml
#  4. GitHub -> tab Actions -> "Build Opta loader (EuraPortenta)" -> Run workflow.
#  5. A fine build scarica l'artifact "opta-loader" (contiene i firmwares/).

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout core
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools python3-venv \
                                  build-essential git cmake ninja-build zstd jq rsync

      - name: Bootstrap Zephyr (west + SDK)
        run: |
          set +o pipefail
          yes | ./extra/bootstrap.sh

      - name: Applica export + conf EuraPortenta
        run: |
          echo ">> Accodo gli EXPORT_SYMBOL al loader"
          cat eura_llext_exports.c >> loader/llext_exports.c
          echo ">> Accodo i CONFIG alla variante Opta"
          cat eura_opta.conf >> variants/arduino_opta_stm32h747xx_m7/arduino_opta_stm32h747xx_m7.conf
          echo ">> Allarga user_sketch a 1 MiB nell'overlay Opta"
          cat eura_opta_flash.overlay >> variants/arduino_opta_stm32h747xx_m7/arduino_opta_stm32h747xx_m7.overlay

      - name: Integra modulo FOTA apply (Fase 3-B)
        run: |
          set -e
          # I sorgenti eura possono stare nella root del fork o nella sottocartella eura/.
          SRC_DIR="."
          if [ -f eura/eura_fota_apply.c ]; then SRC_DIR="eura"; fi
          if [ ! -f "$SRC_DIR/eura_fota_apply.c" ]; then
            echo "ERRORE: eura_fota_apply.c non trovato (ne' in ./ ne' in eura/)."
            exit 1
          fi
          echo ">> Copio il modulo FOTA apply in loader/ (auto-globbed da CMakeLists: FILE(GLOB *.c))"
          cp "$SRC_DIR/eura_fota_apply.c" loader/eura_fota_apply.c
          cp "$SRC_DIR/eura_fota_apply.h" loader/eura_fota_apply.h

          echo ">> Patch loader/main.c: #include dopo LOG_MODULE_REGISTER(sketch);"
          if ! grep -q 'eura_fota_apply.h' loader/main.c; then
            sed -i 's@\(LOG_MODULE_REGISTER(sketch);\)@\1\n#include "eura_fota_apply.h"@' loader/main.c
          fi

          echo ">> Patch loader/main.c: chiamata come PRIMA istruzione di loader()"
          if ! grep -q 'eura_fota_apply_pending' loader/main.c; then
            perl -0pi -e 's/(static int loader\(const struct shell \*sh\) \{)/$1\n\t(void)eura_fota_apply_pending();/' loader/main.c
          fi

          echo ">> Verifica patch applicate:"
          grep -n 'eura_fota_apply' loader/main.c
          if [ "$(grep -c 'eura_fota_apply' loader/main.c)" -lt 2 ]; then
            echo "ERRORE: patch main.c incompleta (attese >= 2 occorrenze: include + chiamata)."
            exit 1
          fi

      - name: Build loader per Opta
        run: |
          # build.sh gestisce venv/west internamente (vedi README del core).
          ./extra/build.sh opta

      - name: Raccogli artefatti di analisi (.config / .map / .dts)
        if: always()
        run: |
          mkdir -p analysis
          # Le posizioni esatte dipendono dalla build dir di build.sh: cerchiamo
          # ovunque e copiamo appiattendo i nomi (prefisso con la dir genitore).
          echo ">> Cerco .config / zephyr.map / zephyr.dts sotto l'albero di build"
          find . -type f \( -name '.config' -o -name 'zephyr.map' -o -name 'zephyr.dts' \
                            -o -name '*.map' -o -name 'ram_report' -o -name 'rom_report' \) \
                 -path '*build*' 2>/dev/null | while read -r f; do
            safe=$(echo "$f" | sed 's#^\./##; s#/#__#g')
            cp -v "$f" "analysis/$safe" || true
          done
          echo ">> Genero ram_report/rom_report se possibile (best effort)"
          BUILD_DIR=$(dirname "$(find . -name '.config' -path '*build*' 2>/dev/null | head -n1)")
          echo "BUILD_DIR=$BUILD_DIR"
          ls -la analysis || true

      - name: Carica i firmware come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opta-loader
          if-no-files-found: warn
          path: |
            firmwares/zephyr-arduino_opta_stm32h747xx_m7.bin
            firmwares/zephyr-arduino_opta_stm32h747xx_m7.elf
            firmwares/zephyr-arduino_opta_stm32h747xx_m7.hex
            variants/arduino_opta_stm32h747xx_m7/**
            analysis/**
